<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Create Account | Notes Cloud</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Plus+Jakarta+Sans:wght@600;700&family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../styles/register.css">
  <link rel="icon" href="data:,">
</head>

<body class="page page--register">
  <main class="register-page">
    <section class="register-card" aria-labelledby="register-title">
      <div class="register-card__decoration register-card__decoration--top" aria-hidden="true"></div>
      <div class="register-card__decoration register-card__decoration--bottom" aria-hidden="true"></div>

      <header class="register-header">
        <a class="brand" href="#" aria-label="Notes Cloud home">
          <img
            class="brand__icon"
            src="../assets/NotesAppLogo.png"
            alt="Notes App Icon"
          >
        </a>

        <div class="brand__name">
          <span class="brand__title">Notes</span>
          <span class="brand__badge">Cloud</span>
        </div>

        <h1 class="register-header__title" id="register-title">Create your account</h1>
        <p class="register-header__subtitle">Start organizing your thoughts and ideas</p>
      </header>

      <form class="register-form" id="register-form">
        <div class="form-field">
          <label class="form-field__label" for="full-name">Full Name</label>
          <div class="input-wrapper">
            <span class="material-symbols-outlined input-wrapper__icon" aria-hidden="true">person</span>
            <input
              class="form-input"
              id="full-name"
              name="fullName"
              placeholder="Sarah Jenkins"
              required
              type="text"
              autocomplete="name"
            >
          </div>
        </div>

        <div class="form-field">
          <label class="form-field__label" for="email">Email address</label>
          <div class="input-wrapper">
            <span class="material-symbols-outlined input-wrapper__icon" aria-hidden="true">mail</span>
            <input
              class="form-input"
              id="email"
              name="email"
              placeholder="sarah@example.com"
              required
              type="email"
              autocomplete="email"
            >
          </div>
        </div>

        <div class="form-field">
          <label class="form-field__label" for="password">Password</label>
          <div class="input-wrapper">
            <span class="material-symbols-outlined input-wrapper__icon" aria-hidden="true">lock</span>
            <input
              class="form-input form-input--password"
              id="password"
              name="password"
              placeholder="Create a strong password"
              required
              type="password"
              autocomplete="new-password"
            >
            <button
              class="icon-button input-wrapper__action"
              id="toggle-password"
              type="button"
              aria-label="Toggle password visibility"
              aria-controls="password"
              aria-pressed="false"
            >
              <span class="material-symbols-outlined" id="toggle-password-icon" aria-hidden="true">visibility</span>
            </button>
          </div>

          <div class="password-strength" aria-live="polite">
            <div class="password-strength__header">
              <span class="password-strength__label">Password strength</span>
              <span class="password-strength__value" id="strength-label">Strong password</span>
            </div>

            <div class="password-strength__bars" aria-hidden="true">
              <span class="password-strength__bar" id="bar-1"></span>
              <span class="password-strength__bar" id="bar-2"></span>
              <span class="password-strength__bar" id="bar-3"></span>
            </div>
          </div>
        </div>

        <div class="form-field">
          <label class="form-field__label" for="confirm-password">Confirm Password</label>
          <div class="input-wrapper">
            <span class="material-symbols-outlined input-wrapper__icon" aria-hidden="true">lock_reset</span>
            <input
              class="form-input form-input--password"
              id="confirm-password"
              name="confirmPassword"
              placeholder="Repeat password"
              required
              type="password"
              autocomplete="new-password"
            >
            <button
              class="icon-button input-wrapper__action"
              id="toggle-confirm-password"
              type="button"
              aria-label="Toggle confirm password visibility"
              aria-controls="confirm-password"
              aria-pressed="false"
            >
              <span class="material-symbols-outlined" id="toggle-confirm-icon" aria-hidden="true">visibility</span>
            </button>
          </div>
        </div>

        <div class="terms-field">
          <label class="checkbox">
            <input class="checkbox__input" id="terms" name="terms" required type="checkbox">
            <span class="checkbox__box" aria-hidden="true">
              <span class="material-symbols-outlined checkbox__icon">check</span>
            </span>
          </label>

          <label class="terms-field__text" for="terms">
            I agree to the
            <a class="text-link" href="#">Terms of Service</a>
            and
            <a class="text-link" href="#">Privacy Policy</a>
          </label>
        </div>

        <button class="submit-button" id="submitBtn" type="submit">
          <span>Create Account</span>
          <span class="material-symbols-outlined submit-button__icon" aria-hidden="true">arrow_forward</span>
        </button>
      </form>

      <footer class="register-footer">
        <p class="register-footer__account">
          Already have an account?
          <a class="text-link text-link--strong" href="./login.html">Sign in</a>
        </p>

        <div class="trust-badges">
          <span class="trust-badge">
            <span class="material-symbols-outlined trust-badge__icon" aria-hidden="true">security</span>
            256-bit Encryption
          </span>

          <span class="trust-badges__separator" aria-hidden="true"></span>

          <span class="trust-badge">
            <span class="material-symbols-outlined trust-badge__icon" aria-hidden="true">sync</span>
            Instant Sync
          </span>
        </div>
      </footer>
    </section>
  </main>

  <script type="module" src="../logic/register.js"></script>
</body>
</html>
