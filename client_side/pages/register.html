<!doctype html>

<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta content="width=device-width, initial-scale=1.0" name="viewport" />
    <link
      href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200"
      rel="stylesheet"
    />
    <link href="https://fonts.googleapis.com" rel="preconnect" />
    <link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect" />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&amp;family=Plus+Jakarta+Sans:wght@600;700&amp;display=swap"
      rel="stylesheet"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap"
      rel="stylesheet"
    />
    <link rel="icon" href="data:,">
    <style>
      @layer base {
        html,
        body {
          margin: 0;
          padding: 0;
        }
        body {
          overscroll-behavior: none;
        }
        main > :first-child {
          margin-top: 0 !important;
        }
        main > :last-child {
          margin-bottom: 0 !important;
        }
      }
      ::-webkit-scrollbar {
        display: none;
      }
    </style>
    <script src="https://cdn.tailwindcss.com"></script>
    <script id="tailwind-config">
      tailwind.config = {
        darkMode: "class",
        theme: {
          extend: {
            colors: {
              "on-surface-variant": "#464555",
              "on-primary-fixed": "#0f0069",
              "surface-dim": "#cbdbf5",
              "on-secondary": "#ffffff",
              "tertiary-container": "#bc1d25",
              "on-secondary-container": "#5c647a",
              "on-primary": "#ffffff",
              surface: "#f8f9ff",
              "on-tertiary-container": "#ffd0cc",
              "on-primary-fixed-variant": "#3323cc",
              "surface-container-lowest": "#ffffff",
              "on-tertiary": "#ffffff",
              "on-tertiary-fixed": "#410004",
              "secondary-container": "#dae2fd",
              "on-tertiary-fixed-variant": "#930013",
              outline: "#777587",
              "on-error": "#ffffff",
              primary: "#3525cd",
              "secondary-fixed": "#dae2fd",
              "surface-container-low": "#eff4ff",
              "secondary-fixed-dim": "#bec6e0",
              "inverse-surface": "#213145",
              "surface-container-highest": "#d3e4fe",
              "primary-container": "#4f46e5",
              "inverse-primary": "#c3c0ff",
              error: "#ba1a1a",
              "outline-variant": "#c7c4d8",
              "surface-variant": "#d3e4fe",
              secondary: "#565e74",
              "on-primary-container": "#dad7ff",
              "surface-container-high": "#dce9ff",
              background: "#f8f9ff",
              "tertiary-fixed": "#ffdad7",
              "on-secondary-fixed-variant": "#3f465c",
              "on-error-container": "#93000a",
              "on-surface": "#0b1c30",
              "on-secondary-fixed": "#131b2e",
              "inverse-on-surface": "#eaf1ff",
              "on-background": "#0b1c30",
              "error-container": "#ffdad6",
              "surface-tint": "#4d44e3",
              "tertiary-fixed-dim": "#ffb3ad",
              "surface-container": "#e5eeff",
              "primary-fixed-dim": "#c3c0ff",
              tertiary: "#960014",
              "surface-bright": "#f8f9ff",
              "primary-fixed": "#e2dfff",
            },
            borderRadius: {
              DEFAULT: "0.25rem",
              lg: "0.5rem",
              xl: "0.75rem",
              full: "9999px",
            },
            spacing: {
              "space-lg": "1.5rem",
              "space-xs": "0.25rem",
              "space-md": "1rem",
              margin: "2rem",
              gutter: "1.5rem",
              "space-xl": "2.5rem",
              "margin-mobile": "1rem",
              "space-sm": "0.5rem",
            },
            fontFamily: {
              "headline-sm": ["Plus Jakarta Sans"],
              "body-lg": ["Inter"],
              "label-lg": ["Inter"],
              "label-md": ["Inter"],
              "body-sm": ["Inter"],
              "headline-xl": ["Plus Jakarta Sans"],
              "headline-lg-mobile": ["Plus Jakarta Sans"],
              "label-sm": ["Inter"],
              "headline-md": ["Plus Jakarta Sans"],
              "headline-xl-mobile": ["Plus Jakarta Sans"],
              "headline-lg": ["Plus Jakarta Sans"],
              "body-md": ["Inter"],
            },
            fontSize: {
              "headline-sm": [
                "18px",

              "body-sm": ["12px", { lineHeight: "18px", fontWeight: "400" }],
              "headline-xl": [
                "40px",
                { lineHeight: "48px", fontWeight: "700" },
              ],
              "headline-lg-mobile": [
                "24px",
                { lineHeight: "32px", fontWeight: "600" },
              ],
              "label-sm": ["11px", { lineHeight: "16px", fontWeight: "500" }],
              "headline-md": [
                "22px",
                { lineHeight: "28px", fontWeight: "600" },
              ],
              "headline-xl-mobile": [
                "28px",
                { lineHeight: "36px", fontWeight: "700" },
              ],
              "headline-lg": [
                "30px",
                { lineHeight: "38px", fontWeight: "600" },
              ],
              "body-md": ["14px", { lineHeight: "22px", fontWeight: "400" }],
            },
          },
        },
      };
    </script>
  </head>
  <body
    class="bg-background font-body-md text-body-md text-on-surface min-h-screen flex items-center justify-center p-space-md"
  >
    <main class="w-full flex items-center justify-center">
      <div class="flex flex-col w-full items-center justify-center py-6 px-4">
        <div
          class="w-full max-w-md bg-surface-container-lowest rounded-2xl shadow-xl p-10 flex flex-col relative overflow-hidden transition-all duration-300"
        >
          <div
            class="absolute -top-16 -right-16 w-36 h-36 bg-primary/5 rounded-full blur-2xl pointer-events-none"
          ></div>
          <div
            class="absolute -bottom-16 -left-16 w-36 h-36 bg-secondary-container/40 rounded-full blur-2xl pointer-events-none"
          ></div>
          <div
            class="flex flex-col items-center text-center mb-8 relative z-10"
          >
            <div class="relative group cursor-pointer mb-3">
              <img
                alt="Notes App Icon"
                class="w-12 h-12 rounded-xl shadow-md transition-transform duration-200 group-hover:scale-105"
                src="https://lh3.googleusercontent.com/aida/AEtjO1X1C7r0sTFNBYpPT0wqPbsRta85UuH_sDteyQ2y7xJN0h9ktaJVlzmK3UJR_3AoJC3E_RdYG_ql2VJG-R9zpUd7wceCjJ6L_Nguld6kxJG5ETBJiN62ODCECJK2Nw0v9pQbfZ9Q9zvRV4mnilcoIdVKeXqCAuU5huAdxAWXpmxnrVkhnjAMEaIjly8OeHUfZ_cc8lkpU6B78tq5o6F-MAJe52Tvx8361aWF_q-0feZM03gUq3K4bZWVzKmN"
              />
            </div>
            <div class="flex items-center gap-1.5 mb-2">
              <span
                class="font-headline-sm text-headline-sm text-on-surface tracking-tight"
                >Notes</span
              >
              <span
                class="px-2 py-0.5 rounded-full bg-secondary-container text-on-secondary-fixed text-label-sm font-label-sm uppercase tracking-wider"
                >Cloud</span
              >
            </div>
            <h1
              class="font-headline-lg text-headline-lg text-on-surface tracking-tight mt-1"
            >
              Create your account
            </h1>
            <p class="font-body-md text-body-md text-secondary mt-1.5">
              Start organizing your thoughts and ideas
            </p>
          </div>

          <form
            class="flex flex-col space-y-4 relative z-10"
            id="register-form"
          >
            <div class="flex flex-col gap-1.5">
              <label
                class="font-label-md text-label-md text-on-surface"
                for="full-name"
                >Full Name</label
              >
              <div class="relative flex items-center">
                <span
                  class="material-symbols-outlined absolute left-3 text-secondary text-lg pointer-events-none transition-colors"
                  >person</span
                >
                <input
                  class="w-full bg-surface-container-lowest text-on-surface placeholder:text-outline/70 pl-10 pr-3 py-2.5 rounded-lg shadow-sm font-body-md text-body-md transition-all focus:outline-none focus:shadow-md focus:bg-surface-container-low"
                  id="full-name"
                  placeholder="Sarah Jenkins"
                  required=""
                  type="text"
                />
              </div>
            </div>
            <div class="flex flex-col gap-1.5">
              <label
                class="font-label-md text-label-md text-on-surface"
                for="email"
                >Email address</label
              >
              <div class="relative flex items-center">
                <span
                  class="material-symbols-outlined absolute left-3 text-secondary text-lg pointer-events-none transition-colors"
                  >mail</span
                >
                <input
                  class="w-full bg-surface-container-lowest text-on-surface placeholder:text-outline/70 pl-10 pr-3 py-2.5 rounded-lg shadow-sm font-body-md text-body-md transition-all focus:outline-none focus:shadow-md focus:bg-surface-container-low"
                  id="email"
                  placeholder="sarah@example.com"
                  required=""
                  type="email"
                />
              </div>
            </div>
            <div class="flex flex-col gap-1.5">
              <label
                class="font-label-md text-label-md text-on-surface"
                for="password"
                >Password</label
              >
              <div class="relative flex items-center">
                <span
                  class="material-symbols-outlined absolute left-3 text-secondary text-lg pointer-events-none transition-colors"
                  >lock</span
                >
                <input
                  class="w-full bg-surface-container-lowest text-on-surface placeholder:text-outline/70 pl-10 pr-10 py-2.5 rounded-lg shadow-sm font-body-md text-body-md transition-all focus:outline-none focus:shadow-md focus:bg-surface-container-low"
                  id="password"
                  placeholder="Create a strong password"
                  required=""
                  type="password"
                />
                <button
                  aria-label="Toggle password visibility"
                  class="absolute right-3 text-secondary hover:text-on-surface transition-colors p-1 flex items-center justify-center focus:outline-none rounded"
                  id="toggle-password"
                  type="button"
                >
                  <span
                    class="material-symbols-outlined text-lg"
                    id="toggle-password-icon"
                    >visibility</span
                  >
                </button>
              </div>
              <div class="pt-2 flex flex-col gap-1.5">
                <div
                  class="flex items-center justify-between text-label-sm font-label-sm"
                >
                  <span class="text-secondary">Password strength</span>
                  <span class="text-primary font-semibold" id="strength-label"
                    >Strong password</span
                  >
                </div>
                <div class="grid grid-cols-3 gap-1.5 h-1.5 w-full">
                  <div
                    class="h-full rounded-full bg-primary transition-all duration-300"
                    id="bar-1"
                  ></div>
                  <div
                    class="h-full rounded-full bg-primary transition-all duration-300"
                    id="bar-2"
                  ></div>
                  <div
                    class="h-full rounded-full bg-primary transition-all duration-300"
                    id="bar-3"
                  ></div>
                </div>
              </div>
            </div>
            <div class="flex flex-col gap-1.5">
              <label
                class="font-label-md text-label-md text-on-surface"
                for="confirm-password"
                >Confirm Password</label
              >
              <div class="relative flex items-center">
                <span
                  class="material-symbols-outlined absolute left-3 text-secondary text-lg pointer-events-none transition-colors"
                  >lock_reset</span
                >
                <input
                  class="w-full bg-surface-container-lowest text-on-surface placeholder:text-outline/70 pl-10 pr-10 py-2.5 rounded-lg shadow-sm font-body-md text-body-md transition-all focus:outline-none focus:shadow-md focus:bg-surface-container-low"
                  id="confirm-password"
                  placeholder="Repeat password"
                  required=""
                  type="password"
                />
                <button
                  aria-label="Toggle confirm password visibility"
                  class="absolute right-3 text-secondary hover:text-on-surface transition-colors p-1 flex items-center justify-center focus:outline-none rounded"
                  id="toggle-confirm-password"
                  type="button"
                >
                  <span
                    class="material-symbols-outlined text-lg"
                    id="toggle-confirm-icon"
                    >visibility</span
                  >
                </button>
              </div>
            </div>
            <div class="flex items-start gap-2.5 pt-1">
              <label
                class="relative flex items-center cursor-pointer mt-0.5 select-none"
              >
                <input
                  class="peer sr-only"
                  id="terms"
                  required=""
                  type="checkbox"
                />
                <div
                  class="w-4 h-4 rounded bg-surface-container-high peer-checked:bg-primary transition-all flex items-center justify-center shadow-xs"
                >
                  <span
                    class="material-symbols-outlined text-white text-xs opacity-0 peer-checked:opacity-100 transition-opacity font-bold"
                    >check</span
                  >
                </div>
              </label>
              <label
                class="font-body-sm text-body-sm text-secondary select-none cursor-pointer leading-tight"
                for="terms"
              >
                I agree to the
                <a
                  class="text-primary font-medium hover:underline focus:outline-none"
                  href="#"
                  >Terms of Service</a
                >
                and
                <a
                  class="text-primary font-medium hover:underline focus:outline-none"
                  href="#"
                  >Privacy Policy</a
                >
              </label>
            </div>
            <button
              id="submitBtn"
              class="w-full bg-primary hover:bg-primary-container text-on-primary font-label-lg text-label-lg py-3 rounded-lg shadow-md hover:shadow-lg transition-all transform active:scale-[0.99] flex items-center justify-center gap-2 mt-2"
              type="submit"
            >
              <span>Create Account</span>
              <span class="material-symbols-outlined text-lg"
                >arrow_forward</span
              >
            </button>
          </form>
          
          
          <div
            class="mt-8 pt-6 flex flex-col items-center justify-center gap-4 relative z-10 bg-surface-container-low/40 -mx-10 -mb-10 p-6 rounded-b-2xl"
          >
            <p class="font-body-md text-body-md text-secondary text-center">
              Already have an account?
              <a
                class="text-primary font-label-md text-label-md hover:underline focus:outline-none transition-colors ml-1 font-semibold"
                href="./login.html"
                >Sign in</a
              >
            </p>
            <div
              class="flex items-center justify-center gap-6 text-outline text-label-sm font-label-sm"
            >
              <span class="flex items-center gap-1">
                <span class="material-symbols-outlined text-sm">security</span>
                256-bit Encryption
              </span>
              <span class="w-1 h-1 rounded-full bg-outline-variant"></span>
              <span class="flex items-center gap-1">
                <span class="material-symbols-outlined text-sm">sync</span>
                Instant Sync
              </span>
            </div>
          </div>
        </div>
      </div>
      
      <script type="module" src="../logic/register.js"></script>
    </main>
  </body>
</html>
