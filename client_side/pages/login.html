<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Sign in to access your Notes and Journals." />
    <title>Login - Notes</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Plus+Jakarta+Sans:wght@600;700&display=swap" rel="stylesheet" />
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght@100..700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="../styles/login.css" />
  </head>
  <body class="login-page">
    <main class="login-page__main">
      <section class="login-container" aria-labelledby="login-title">
        <!-- Decorative background elements -->
        <div class="login-decoration login-decoration--top" aria-hidden="true"></div>
        <div class="login-decoration login-decoration--bottom" aria-hidden="true"></div>
        <div class="login-card">
          <header class="login-header">
            <!-- Logo -->
            <div class="login-logo" aria-hidden="true">
              <div class="login-logo__image"><img src="../assets/NotesAppLogo.png" alt="Notes Logo" /></div>
              <span class="login-logo__edit material-symbols-outlined">edit</span>
            </div>
            <!-- Workspace Badge -->
            <div class="workspace-badge">
              <span class="workspace-badge__dot" aria-hidden="true"></span>
              <span>Notes Workspace</span>
            </div>
            <h1 id="login-title" class="login-header__title">Welcome back</h1>
            <p class="login-header__subtitle">Sign in to access your notes and journals</p>
          </header>
          <!-- Login Form -->
          <form id="login-form" class="login-form">
            <div class="error-container is-hidden" id="error-container" aria-live="assertive">
              <span class="material-symbols-outlined error-container__icon" aria-hidden="true">error</span>
              <span class="error-container__text" id="error-text"></span>
            </div>
            <!-- Email Field -->
            <div class="form-field">
              <label for="email-field" class="form-field__label">
                <span>Email address</span> <span class="form-field__hint">Work or personal</span>
              </label>
              <div class="input-wrapper">
                <span class="input-wrapper__icon material-symbols-outlined" aria-hidden="true">alternate_email</span>
                <input id="email-field" class="form-input form-input--with-left-icon" type="email" name="email" autocomplete="email" placeholder="email" required />
              </div>
            </div>
            <!-- Password Field -->
            <div class="form-field">
              <div class="form-field__label-row">
                <label for="password-field" class="form-field__label"><span>Password</span></label>
                <a id="forgot-password-link" class="form-link" href="#">Forgot password?</a>
              </div>
              <div class="input-wrapper">
                <span class="input-wrapper__icon material-symbols-outlined" aria-hidden="true">lock</span>
                <input id="password-field" class="form-input form-input--with-left-icon form-input--with-right-control" type="password" name="password" autocomplete="current-password" placeholder="password" required />
                <button id="toggle-pwd-btn" class="password-toggle" type="button" aria-label="Toggle password visibility" aria-pressed="false">
                  <span id="pwd-icon" class="material-symbols-outlined" aria-hidden="true">visibility</span>
                </button>
              </div>
            </div>
            <!-- Remember Me -->
            <div class="remember-field">
              <label class="remember-control">
                <input id="remember-me" class="remember-control__input" type="checkbox" checked />
                <span class="remember-control__box" aria-hidden="true"><span class="material-symbols-outlined">check</span></span>
                <span class="remember-control__text">Remember for 30 days</span>
              </label>
            </div>
            <!-- Submit -->
            <button id="submit-btn" class="submit-button" type="submit">
              <span id="submit-text">Sign in to Notes</span>
              <span id="submit-icon" class="submit-button__icon material-symbols-outlined" aria-hidden="true">arrow_forward</span>
            </button>
          </form>
          <!-- Register Link -->
          <div class="register-prompt">
            <p class="register-prompt__text">Don't have an account? <a class="form-link register-prompt__link" href="./register.html">Create an account</a></p>
          </div>
          <!-- Footer -->
          <footer class="login-footer">
            <div class="login-footer__item">
              <span class="material-symbols-outlined login-footer__icon" aria-hidden="true">verified_user</span>
              <span>Protected by 256-bit encryption</span>
            </div>
            <span class="login-footer__separator" aria-hidden="true"></span>
            <a class="login-footer__link" href="#">Privacy</a>
            <span class="login-footer__separator" aria-hidden="true"></span>
            <a class="login-footer__link" href="#">Terms</a>
          </footer>
        </div>
      </section>
    </main>
    <script type="module" src="../logic/login.js"></script>
  </body>
</html>
