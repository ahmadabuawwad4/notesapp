    <!-- Global Styles -->
    <style>
      @layer base {
        html,
        body {
          margin: 0;
          padding: 0;
        }

        body {
          overscroll-behavior: none;
        }

        main > :first-child {
          margin-top: 0 !important;
        }

        main > :last-child {
          margin-bottom: 0 !important;
        }
      }

      }
    </style>

  <body
    class="min-h-screen flex items-center justify-center p-space-md bg-background text-on-surface font-body-md"
  >
    <!-- Main Content -->
    <main class="w-full flex items-center justify-center">
      <div
        class="w-full flex flex-col items-center justify-center py-6 sm:py-10"
      >
        <!-- Login Container -->
        <div class="relative w-full max-w-md mx-auto">
          <!-- Background Decoration -->
          <div
            class="absolute -top-12 -left-12 w-64 h-64 rounded-full bg-secondary-container/40 blur-3xl pointer-events-none -z-10"
          ></div>

          <div
            class="absolute -bottom-10 -right-10 w-64 h-64 rounded-full bg-primary-fixed/50 blur-3xl pointer-events-none -z-10"
          ></div>

          <!-- Login Card -->
          <div
            class="relative w-full flex flex-col p-8 sm:p-10 bg-surface-container-lowest rounded-xl shadow-xl"
          >
            <!-- Header -->
            <div class="flex flex-col items-center text-center mb-8">
              <!-- Logo -->
              <div class="relative mb-4 group cursor-pointer">
                <div
                  class="w-14 h-14 flex items-center justify-center overflow-hidden rounded-xl shadow-md transition-transform duration-300 group-hover:scale-105"
                >
                  <img
                    src="https://lh3.googleusercontent.com/aida/AEtjO1X1C7r0sTFNBYpPT0wqPbsRta85UuH_sDteyQ2y7xJN0h9ktaJVlzmK3UJR_3AoJC3E_RdYG_ql2VJG-R9zpUd7wceCjJ6L_Nguld6kxJG5ETBJiN62ODCECJK2Nw0v9pQbfZ9Q9zvRV4mnilcoIdVKeXqCAuU5huAdxAWXpmxnrVkhnjAMEaIjly8OeHUfZ_cc8lkpU6B78tq5o6F-MAJe52Tvx8361aWF_q-0feZM03gUq3K4bZWVzKmN"
                    alt="Notes Logo"
                    class="w-full h-full object-cover"
                  />
                </div>

                <!-- Edit Icon -->
                <div
                  class="absolute -bottom-1 -right-1 w-4 h-4 flex items-center justify-center rounded-full bg-primary ring-2 ring-surface-container-lowest"
                >
                  <span
                    class="material-symbols-outlined text-[10px] text-on-primary"
                  >
                    edit
                  </span>
                </div>
              </div>

              <!-- Workspace Badge -->
              <div
                class="inline-flex items-center gap-1.5 px-3 py-1 mb-3 rounded-full bg-surface-container-low text-primary text-label-sm font-label-sm"
              >
                <span
                  class="w-1.5 h-1.5 rounded-full bg-primary animate-pulse"
                ></span>

                <span>Notes Workspace</span>
              </div>

              <!-- Title -->
              <h1
                class="mb-1.5 tracking-tight text-on-surface font-headline-md text-headline-md"
              >
                Welcome back
              </h1>

              <!-- Subtitle -->
              <p class="text-secondary font-body-md text-body-md">
                Sign in to access your notes and journals
              </p>
            </div>

            <!-- Login Form -->
            <form id="login-form" class="flex flex-col space-y-5">
              <!-- Email -->
              <div class="flex flex-col gap-1.5">
                <label
                  for="email-field"
                  class="flex items-center justify-between text-on-surface font-label-md text-label-md"
                >
                  <span>Email address</span>

                  <span class="text-secondary font-body-sm text-body-sm">
                    Work or personal
                  </span>
                </label>

                <div class="relative flex items-center">
                  <span
                    class="absolute left-3 text-secondary text-[20px] pointer-events-none material-symbols-outlined"
                  >
                    alternate_email
                  </span>

                  <input
                    id="email-field"
                    type="email"
                    name="email"
                    autocomplete="email"
                    placeholder="email"
                    required
                    class="w-full pl-10 pr-4 py-2.5 rounded-lg shadow-sm text-on-surface bg-surface-container-lowest font-body-md text-body-md placeholder:text-secondary-fixed-dim focus:outline-none focus:bg-surface-container-lowest transition-all duration-150"
                  />
                </div>
              </div>

              <!-- Password -->
              <div class="flex flex-col gap-1.5">
                <!-- Password Label -->
                <div class="flex items-center justify-between">
                  <label
                    for="password-field"
                    class="text-on-surface font-label-md text-label-md"
                  >
                    Password
                  </label>

                  <a
                    href="#"
                    onclick="alert('This feature is under development.')"
                    class="text-primary font-label-md text-label-md hover:text-on-primary-fixed-variant hover:underline underline-offset-2 transition-colors"
                  >
                    Forgot password?
                  </a>
                </div>

                <!-- Password Input -->
                <div class="relative flex items-center">
                  <span
                    class="absolute left-3 text-secondary text-[20px] pointer-events-none material-symbols-outlined"
                  >
                    lock
                  </span>

                  <input
                    id="password-field"
                    type="password"
                    name="password"
                    autocomplete="current-password"
                    placeholder="password"
                    required
                    class="w-full pl-10 pr-11 py-2.5 rounded-lg shadow-sm text-on-surface bg-surface-container-lowest font-body-md text-body-md placeholder:text-secondary-fixed-dim focus:outline-none focus:bg-surface-container-lowest transition-all duration-150"
                  />

                  <!-- Toggle Password -->
                  <button
                    id="toggle-pwd-btn"
                    type="button"
                    aria-label="Toggle password visibility"
                    class="absolute right-2 p-1.5 rounded-lg text-secondary hover:text-on-surface hover:bg-surface-container-low transition-colors"
                  >
                    <span
                      id="pwd-icon"
                      class="material-symbols-outlined text-[20px]"
                    >
                      visibility
                    </span>
                  </button>
                </div>
              </div>

              <!-- Remember Me -->
              <div class="flex items-center justify-between pt-1">
                <label
                  class="flex items-center gap-2.5 cursor-pointer select-none group"
                >
                  <input
                    id="remember-me"
                    type="checkbox"
                    checked
                    class="sr-only peer"
                  />

                  <div
                    class="w-4 h-4 flex items-center justify-center rounded shadow-sm bg-surface-container-lowest peer-checked:bg-primary-container group-hover:bg-surface-container-high transition-all"
                  >
                    <span
                      class="text-[13px] text-on-primary opacity-0 peer-checked:opacity-100 font-bold transition-opacity material-symbols-outlined"
                    >
                      check
                    </span>
                  </div>

                  <span
                    class="text-secondary font-body-md text-body-md group-hover:text-on-surface transition-colors"
                  >
                    Remember for 30 days
                  </span>
                </label>
              </div>

              <!-- Submit Button -->
              <button
                id="submit-btn"
                type="submit"
                class="w-full mt-2 py-3 flex items-center justify-center gap-2 rounded-lg shadow-md bg-primary-container hover:bg-primary text-on-primary font-label-lg text-label-lg hover:shadow-lg active:scale-[0.99] transition-all duration-150 group cursor-pointer"
              >
                <span id="submit-text"> Sign in to Notes </span>

                <span
                  id="submit-icon"
                  class="text-[18px] transition-transform duration-200 group-hover:translate-x-1 material-symbols-outlined"
                >
                  arrow_forward
                </span>
              </button>
            </form>

            <!-- Register Link -->
            <div class="text-center pt-2">
              <p class="text-secondary font-body-md text-body-md">
                Don't have an account?

                <a
                  href="./register.html"
                  class="ml-1 text-primary font-label-md text-label-md hover:text-on-primary-fixed-variant hover:underline underline-offset-2"

                  Create an account

            <!-- Footer -->

              <div

              >
                <span
                  class="text-[16px] text-primary material-symbols-outlined"
                  style="font-variation-settings: &quot;FILL&quot; 1"
                >
                  verified_user
                </span>

                <span> Protected by 256-bit encryption </span>
              </div>

              <span class="w-1 h-1 rounded-full bg-secondary"></span>

              <!-- Privacy -->
              <a
                href="#"
                class="font-label-sm text-label-sm hover:text-on-surface transition-colors"
              >
                Privacy
              </a>

              <span class="w-1 h-1 rounded-full bg-secondary"></span>

              <!-- Terms -->
              <a
                href="#"
                class="font-label-sm text-label-sm hover:text-on-surface transition-colors"
              >
                Terms
              </a>
            </div>
          </div>
          <!-- End Login Card -->
        </div>
        <!-- End Login Container -->
      </div>
    </main>

    <!-- JavaScript -->
    <script type="module">
      import { Login } from "../services/loginService.js";

      // ==========================================
      // Password Visibility Toggle
      // ==========================================
      const loginForm = document.getElementById("login-form");

      const email = document.getElementById("email-field");
      const passwordInput = document.getElementById("password-field");
      const togglePasswordButton = document.getElementById("toggle-pwd-btn");
      const passwordIcon = document.getElementById("pwd-icon");

      togglePasswordButton.addEventListener("click", () => {
        const isPassword = passwordInput.type === "password";

        passwordInput.type = isPassword ? "text" : "password";
        passwordIcon.textContent = isPassword ? "visibility_off" : "visibility";
      });

      // ==========================================
      // Login Form Submit
      // ==========================================

      loginForm.addEventListener("submit", async (event) => {
        event.preventDefault();

        await triggerSubmit();
      });

      async function triggerSubmit() {
        const submitButton = document.getElementById("submit-btn");
        const submitText = document.getElementById("submit-text");
        const submitIcon = document.getElementById("submit-icon");

        // Disable button
        submitButton.disabled = true;

        // Loading state
        submitText.textContent = "Signing in...";

        submitIcon.classList.add("animate-spin");
        submitIcon.textContent = "sync";

        const result = await Login(email.value, passwordInput.value);

        // Simulate login request
        setTimeout(() => {
          submitButton.disabled = false;

          // Success state
          submitText.textContent = "Redirecting...";

          submitIcon.classList.remove("animate-spin");
          submitIcon.textContent = "check";

          submitButton.classList.remove("bg-primary-container");
          submitButton.classList.add("bg-primary");
        }, 900);

        if (result) {
          sessionStorage.setItem("token", result.token);
          window.location = "./dashboard.html";
        }
      }
    </script>
