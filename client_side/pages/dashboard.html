<!DOCTYPE html>

<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">


<title>Notes Dashboard</title>

<!-- Google Fonts -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Plus+Jakarta+Sans:wght@600;700&family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&display=swap"
    rel="stylesheet"
>

<!-- Tailwind -->
<script src="https://cdn.tailwindcss.com"></script>

<script>
    tailwind.config = {
        darkMode: "class",

        theme: {
            extend: {

                colors: {
                    primary: "#3525cd",
                    "primary-container": "#4f46e5",
                    "on-primary": "#ffffff",

                    secondary: "#565e74",
                    "secondary-container": "#dae2fd",
                    "on-secondary-container": "#5c647a",

                    surface: "#f8f9ff",
                    "surface-container-lowest": "#ffffff",
                    "surface-container-low": "#eff4ff",
                    "surface-container": "#e5eeff",
                    "surface-container-high": "#dce9ff",

                    "on-surface": "#0b1c30",
                    "on-surface-variant": "#464555",

                    outline: "#777587",
                    "outline-variant": "#c7c4d8",

                    error: "#ba1a1a",
                    "error-container": "#ffdad6",
                    "on-error": "#ffffff",

                    background: "#f8f9ff"
                },

                borderRadius: {
                    lg: "0.5rem",
                    xl: "0.75rem",
                    "2xl": "1rem",
                    full: "9999px"
                },

                spacing: {
                    "space-xs": "0.25rem",
                    "space-sm": "0.5rem",
                    "space-md": "1rem",
                    "space-lg": "1.5rem",
                    "space-xl": "2.5rem",
                    gutter: "1.5rem"
                },

                fontFamily: {
                    headline: ["Plus Jakarta Sans", "sans-serif"],
                    body: ["Inter", "sans-serif"]
                },

                fontSize: {
                    "headline-sm": [
                        "18px",
                        {
                            lineHeight: "24px",
                            fontWeight: "600"
                        }
                    ],

                    "headline-lg": [
                        "30px",
                        {
                            lineHeight: "38px",
                            fontWeight: "600"
                        }
                    ],

                    "body-md": [
                        "14px",
                        {
                            lineHeight: "22px",
                            fontWeight: "400"
                        }
                    ],

                    "body-sm": [
                        "12px",
                        {
                            lineHeight: "18px",
                            fontWeight: "400"
                        }
                    ],

                    "label-md": [
                        "13px",
                        {
                            lineHeight: "18px",
                            fontWeight: "500"
                        }
                    ],

                    "label-sm": [
                        "11px",
                        {
                            lineHeight: "16px",
                            fontWeight: "500"
                        }
                    ]
                }
            }
        }
    };
</script>

<style>

    html,
    body {
        margin: 0;
        padding: 0;
    }

    body {
        overscroll-behavior: none;
        overflow-x: hidden;
        background: #f8f9ff;
    }

    ::-webkit-scrollbar {
        width: 0;
        height: 0;
    }

    button,
    a {
        -webkit-tap-highlight-color: transparent;
    }

</style>


</head>

<body class="bg-background text-on-surface font-body antialiased">


<!-- ========================================================= -->
<!-- Sidebar -->
<!-- ========================================================= -->

<aside
    class="
        fixed
        left-0
        top-0
        z-50
        flex
        h-screen
        w-16
        flex-col
        md:w-64
        border-r
        border-outline-variant/40
        bg-surface-container-low
        py-space-md
    "
>

    <!-- Logo -->

    <div class="mb-space-lg flex items-center justify-center gap-space-sm px-space-sm md:justify-start md:px-space-md">

        <img
            src="https://lh3.googleusercontent.com/aida/AEtjO1X1C7r0sTFNBYpPT0wqPbsRta85UuH_sDteyQ2y7xJN0h9ktaJVlzmK3UJR_3AoJC3E_RdYG_ql2VJG-R9zpUd7wceCjJ6L_Nguld6kxJG5ETBJiN62ODCECJK2Nw0v9pQbfZ9Q9zvRV4mnilcoIdVKeXqCAuU5huAdxAWXpmxnrVkhnjAMEaIjly8OeHUfZ_cc8lkpU6B78tq5o6F-MAJe52Tvx8361aWF_q-0feZM03gUq3K4bZWVzKmN"
            alt="Notes Logo"
            class="h-8 w-auto object-contain"
        >

        <span
            class="
                hidden
                font-headline
                text-headline-sm md:inline
                tracking-tight
                text-on-surface
            "
        >
            Notes
        </span>

    </div>


    <!-- Navigation -->

    <nav
        class="flex flex-1 flex-col gap-1 px-space-sm md:px-space-md"
        aria-label="Main navigation"
    >

        <a
            href="#"
            data-path="dashboard"
            aria-current="page"
            class="
                flex
                items-center
                justify-center
                gap-space-sm
                rounded-lg
                md:justify-start
                bg-secondary-container
                px-space-sm
                py-2
                text-on-secondary-container
                transition-colors
                hover:bg-secondary-container/80
            "
        >

            <span class="material-symbols-outlined text-xl">
                description
            </span>

            <span class="hidden font-body text-label-md md:inline">
                All Notes
            </span>

        </a>

    </nav>


    <!-- Logout -->

    <div class="px-space-sm pt-space-md md:px-space-md">

        <div
            class="
                flex
                items-center
                justify-center
                rounded-xl
                bg-surface-container-lowest
                md:justify-start
                p-space-xs
                shadow-[0_1px_3px_0_rgba(15,23,42,0.04)]
            "
        >

            <button
                id="logoutButton"
                type="button"
                title="Log out"
                aria-label="Log out"
                class="
                    flex
                    items-center
                    justify-center
                    rounded-md
                    p-2
                    text-on-surface-variant
                    transition-colors
                    hover:bg-error-container
                    hover:text-error
                "
            >

                <span class="material-symbols-outlined text-base">
                    logout
                </span>

            </button>

        </div>

    </div>

</aside>


<!-- ========================================================= -->
<!-- Main Content -->
<!-- ========================================================= -->

<div class="pl-16 md:pl-64">

    <main class="min-h-screen w-full bg-background px-4 pt-8 sm:px-6 sm:pt-10 lg:px-gutter lg:pt-12">

        <div class="mx-auto flex w-full max-w-7xl flex-col pb-space-xl">


            <!-- ================================================= -->
            <!-- Header -->
            <!-- ================================================= -->

            <section class="mb-space-lg flex flex-col gap-space-md pt-space-md">

                <div
                    class="
                        flex
                        flex-wrap
                        items-center
                        justify-between
                        gap-space-md
                    "
                >

                    <!-- Title -->

                    <div>

                        <h1
                            class="
                                font-headline
                                text-2xl
                                tracking-tight
                                sm:text-headline-lg
                                text-on-surface
                            "
                        >
                            My Notes
                        </h1>

                        <p class="mt-1 text-body-md text-on-surface-variant">
                            Keep your thoughts, ideas, and tasks organized.
                        </p>

                    </div>


                    <!-- New Note -->

                    <button
                        id="newNoteButton"
                        type="button"
                        class="
                            inline-flex
                            items-center
                            gap-2
                            rounded-lg
                            bg-primary-container
                            px-4
                            py-2.5
                            font-body
                            text-label-md
                            text-on-primary
                            shadow-sm
                            transition-all
                            hover:-translate-y-0.5
                            hover:opacity-95
                            hover:shadow-md
                            active:scale-[0.98]
                        "
                    >

                        <span class="material-symbols-outlined text-lg">
                            add
                        </span>

                        <span>
                            New Note
                        </span>

                    </button>

                </div>


                <!-- Filter -->

                <div class="flex flex-wrap items-center gap-2 pt-1">

                    <button
                        id="allNotesFilter"
                        type="button"
                        class="
                            rounded-full
                            bg-primary
                            px-3.5
                            py-1.5
                            font-body
                            text-label-sm
                            font-semibold
                            text-on-primary
                            shadow-sm
                        "
                    >
                        All Notes (<span id="notesCount">0</span>)
                    </button>

                </div>

            </section>


            <!-- ================================================= -->
            <!-- Loading -->
            <!-- ================================================= -->

            <div
                id="loadingState"
                class="flex items-center justify-center px-2 py-16 sm:py-20"
            >

                <div class="flex items-center gap-3 text-on-surface-variant">

                    <span
                        class="
                            h-5
                            w-5
                            animate-spin
                            rounded-full
                            border-2
                            border-primary/20
                            border-t-primary
                        "
                    ></span>

                    <span class="text-body-md">
                        Loading notes...
                    </span>

                </div>

            </div>


            <!-- ================================================= -->
            <!-- Error -->
            <!-- ================================================= -->

            <div
                id="errorState"
                class="
                    hidden
                    rounded-xl
                    border
                    border-error/20
                    bg-error-container
                    p-4
                    text-body-md
                    break-words
                    text-error
                "
            >
                Failed to load notes.
            </div>


            <!-- ================================================= -->
            <!-- Notes Grid -->
            <!-- ================================================= -->

            <section
                id="notesGrid"
                class="
                    hidden
                    grid
                    grid-cols-1
                    gap-space-md
                    md:grid-cols-2
                    lg:grid-cols-3
                "
            >
                <!-- JavaScript will generate notes here -->
            </section>


            <!-- ================================================= -->
            <!-- Empty State -->
            <!-- ================================================= -->

            <section
                id="emptyState"
                class="
                    hidden
                    mt-space-xl
                    rounded-2xl
                    bg-surface-container-lowest
                    p-3
                    sm:p-space-lg
                    shadow-[0_1px_3px_0_rgba(15,23,42,0.05)]
                "
            >

                <div
                    class="
                        flex
                        flex-col
                        items-center
                        justify-center
                        rounded-xl
                        bg-surface-container-low
                        px-4
                        py-12
                        sm:px-space-md
                        sm:py-space-xl
                        text-center
                    "
                >

                    <!-- Illustration -->

                    <div
                        class="
                            relative
                            mb-space-md
                            flex
                            h-24
                            w-24
                            items-center
                            justify-center
                        "
                    >

                        <div
                            class="
                                absolute
                                inset-0
                                -rotate-6
                                rounded-3xl
                                bg-primary/10
                            "
                        ></div>


                        <div
                            class="
                                relative
                                flex
                                h-20
                                w-20
                                items-center
                                justify-center
                                rounded-2xl
                                bg-primary-container
                                p-3
                                shadow-md
                            "
                        >

                            <svg
                                class="h-12 w-12 text-on-primary"
                                fill="none"
                                stroke="currentColor"
                                stroke-linecap="round"
                                stroke-linejoin="round"
                                stroke-width="1.8"
                                viewBox="0 0 24 24"
                            >

                                <path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"></path>

                                <path
                                    d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"
                                ></path>

                                <line
                                    x1="9"
                                    x2="15"
                                    y1="7"
                                    y2="7"
                                ></line>

                                <line
                                    x1="9"
                                    x2="15"
                                    y1="11"
                                    y2="11"
                                ></line>

                                <line
                                    x1="9"
                                    x2="12"
                                    y1="15"
                                    y2="15"
                                ></line>

                            </svg>

                        </div>

                    </div>


                    <h3
                        class="
                            mb-1
                            font-headline
                            text-headline-sm
                            text-on-surface
                        "
                    >
                        No notes yet
                    </h3>


                    <p
                        class="
                            mb-space-md
                            max-w-sm
                            px-1
                            font-body
                            text-body-md
                            text-on-surface-variant
                        "
                    >
                        Create your first note and start organizing your
                        ideas, project tasks, and knowledge.
                    </p>


                    <button
                        id="emptyStateCreateButton"
                        type="button"
                        class="
                            inline-flex
                            items-center
                            gap-2
                            rounded-lg
                            bg-primary-container
                            px-4
                            py-2.5
                            font-body
                            text-label-md
                            text-on-primary
                            shadow-sm
                            transition-all
                            hover:-translate-y-0.5
                            hover:opacity-90
                            hover:shadow-md
                            active:scale-[0.98]
                        "
                    >

                        <span class="material-symbols-outlined text-base">
                            add
                        </span>

                        <span>
                            Create Note
                        </span>

                    </button>

                </div>

            </section>


        </div>

    </main>

</div>


<!-- JavaScript -->
<script type="module" src="../logic/dashboard.js"></script>



</body>

</html>
