<!doctype html>

<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta content="width=device-width, initial-scale=1.0" name="viewport" />
    <link

      rel="stylesheet"
    />
    <link href="https://fonts.googleapis.com" rel="preconnect" />
    <link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect" />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&amp;family=Plus+Jakarta+Sans:wght@600;700&amp;display=swap"
      rel="stylesheet"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap"
      rel="stylesheet"
    />
    <style>
      @layer base {
        html,
        body {
          margin: 0;
          padding: 0;
        }
        body {
          overscroll-behavior: none;
        }
        main > :first-child {
          margin-top: 0 !important;
        }
        main > :last-child {
          margin-bottom: 0 !important;
        }
      }
      ::-webkit-scrollbar {
        display: none;
      }
    </style>
    <script src="https://cdn.tailwindcss.com"></script>
    <script id="tailwind-config">
      tailwind.config = {
        darkMode: "class",
        theme: {
          extend: {
            colors: {
              "on-surface-variant": "#464555",
              "on-primary-fixed": "#0f0069",
              "surface-dim": "#cbdbf5",
              "on-secondary": "#ffffff",
              "tertiary-container": "#bc1d25",
              "on-secondary-container": "#5c647a",
              "on-primary": "#ffffff",
              surface: "#f8f9ff",
              "on-tertiary-container": "#ffd0cc",
              "on-primary-fixed-variant": "#3323cc",
              "surface-container-lowest": "#ffffff",
              "on-tertiary": "#ffffff",
              "on-tertiary-fixed": "#410004",
              "secondary-container": "#dae2fd",
              "on-tertiary-fixed-variant": "#930013",
              outline: "#777587",
              "on-error": "#ffffff",
              primary: "#3525cd",
              "secondary-fixed": "#dae2fd",
              "surface-container-low": "#eff4ff",
              "secondary-fixed-dim": "#bec6e0",
              "inverse-surface": "#213145",
              "surface-container-highest": "#d3e4fe",
              "primary-container": "#4f46e5",
              "inverse-primary": "#c3c0ff",
              error: "#ba1a1a",
              "outline-variant": "#c7c4d8",
              "surface-variant": "#d3e4fe",
              secondary: "#565e74",
              "on-primary-container": "#dad7ff",
              "surface-container-high": "#dce9ff",
              background: "#f8f9ff",
              "tertiary-fixed": "#ffdad7",
              "on-secondary-fixed-variant": "#3f465c",
              "on-error-container": "#93000a",
              "on-surface": "#0b1c30",
              "on-secondary-fixed": "#131b2e",
              "inverse-on-surface": "#eaf1ff",
              "on-background": "#0b1c30",
              "error-container": "#ffdad6",
              "surface-tint": "#4d44e3",
              "tertiary-fixed-dim": "#ffb3ad",
              "surface-container": "#e5eeff",
              "primary-fixed-dim": "#c3c0ff",
              tertiary: "#960014",
              "surface-bright": "#f8f9ff",
              "primary-fixed": "#e2dfff",
            },
            borderRadius: {
              DEFAULT: "0.25rem",
              lg: "0.5rem",
              xl: "0.75rem",
              full: "9999px",
            },
            spacing: {
              "space-lg": "1.5rem",
              "space-xs": "0.25rem",
              "space-md": "1rem",
              margin: "2rem",
              gutter: "1.5rem",
              "space-xl": "2.5rem",
              "margin-mobile": "1rem",
              "space-sm": "0.5rem",
            },
            fontFamily: {
              "headline-sm": ["Plus Jakarta Sans"],
              "body-lg": ["Inter"],
              "label-lg": ["Inter"],
              "label-md": ["Inter"],
              "body-sm": ["Inter"],
              "headline-xl": ["Plus Jakarta Sans"],
              "headline-lg-mobile": ["Plus Jakarta Sans"],
              "label-sm": ["Inter"],

                "22px",
                { lineHeight: "28px", fontWeight: "600" },
              ],
              "headline-xl-mobile": [
                "28px",
                { lineHeight: "36px", fontWeight: "700" },
              ],
              "headline-lg": [
                "30px",
                { lineHeight: "38px", fontWeight: "600" },
              ],
              "body-md": ["14px", { lineHeight: "22px", fontWeight: "400" }],
            },
          },
        },
      };
    </script>
  </head>
  <body
    class="bg-background font-body-md text-body-md text-on-surface antialiased"
  >
    <header
      class="fixed top-0 w-full z-50 bg-surface/80 backdrop-blur-xl shadow-[0_1px_8px_rgba(0,0,0,0.04)]"
    >
      <div class="h-14 w-full px-gutter flex items-center justify-between">
        <div class="flex items-center gap-space-md">
          
          <div class="h-4 w-px bg-surface-container-high"></div>
          <img
            alt="Notes Logo"
            class="h-6 w-auto object-contain"
            src="https://lh3.googleusercontent.com/aida/AEtjO1X1C7r0sTFNBYpPT0wqPbsRta85UuH_sDteyQ2y7xJN0h9ktaJVlzmK3UJR_3AoJC3E_RdYG_ql2VJG-R9zpUd7wceCjJ6L_Nguld6kxJG5ETBJiN62ODCECJK2Nw0v9pQbfZ9Q9zvRV4mnilcoIdVKeXqCAuU5huAdxAWXpmxnrVkhnjAMEaIjly8OeHUfZ_cc8lkpU6B78tq5o6F-MAJe52Tvx8361aWF_q-0feZM03gUq3K4bZWVzKmN"
          /><span class="font-headline-sm text-headline-sm text-on-surface"
            >Notes</span
          >
        </div>
      </div>
    </header>
    <main class="w-full pt-14 bg-background min-h-screen">
      <div class="flex flex-col w-full">
        <div class="w-full bg-surface px-margin py-space-sm shadow-sm">
          <div
            class="max-w-6xl mx-auto flex items-center justify-between gap-space-md"
          >
            <div class="flex items-center gap-space-md min-w-0">
              <a
                class="inline-flex items-center gap-1.5 px-3 py-1.5 rounded-lg bg-surface-container-low text-on-surface-variant hover:text-on-surface hover:bg-surface-container transition-all"
                href="./dashboard.html"
              >
                <span class="material-symbols-outlined text-lg"
                  >arrow_back</span
                >
                <span class="font-label-md text-label-md">Back to Notes</span>
              </a>
              <div
                class="hidden md:inline-flex items-center gap-1.5 px-2.5 py-1 rounded-lg bg-secondary-container text-on-secondary-container font-label-md text-label-md"
              >
                <span class="material-symbols-outlined text-base"
                  >edit_note</span
                >
                <span id="message" >Editing Note</span>
              </div>
            </div>
            <div class="flex items-center gap-space-sm">
              <button
                class="inline-flex items-center gap-1.5 px-3 py-2 rounded-lg text-error hover:bg-error-container/30 transition-colors font-label-md text-label-md"
                id="discardBtn"
              >
                <span class="material-symbols-outlined text-lg">delete</span>
                <span class="hidden sm:inline">Delete</span>
              </button>
              <button
                class="inline-flex items-center gap-2 px-5 py-2 rounded-lg bg-primary-container text-on-primary font-label-lg text-label-lg shadow-sm hover:opacity-95 active:scale-95 transition-all"
                id="topSaveBtn"
              >
                <span class="material-symbols-outlined text-base">save</span>
                <span>Save Note</span>
              </button>
            </div>
          </div>
        </div>
        <div class="w-full px-margin py-space-lg flex justify-center">
          <div
            class="w-full max-w-4xl bg-surface-container-lowest rounded-xl shadow-md p-6 sm:p-10 flex flex-col min-h-[720px] transition-all"
          >
            <input
              class="w-full font-headline-xl text-headline-xl sm:text-headline-xl text-on-surface placeholder:text-outline-variant bg-transparent focus:outline-none mb-space-md"
              id="noteTitle"
              placeholder="Untitled note..."
              type="text"
            />
            <div class="relative flex-1 flex flex-col">
              <textarea
                class="w-full flex-1 bg-transparent text-on-surface font-body-lg text-body-lg leading-relaxed focus:outline-none resize-none"
                id="editorContent"
                placeholder="Start typing your ideas, notes, and task plans here..."
                rows="16"
              ></textarea
              >
            </div>
            <div
              class="mt-space-lg pt-space-md flex flex-col sm:flex-row items-center justify-between gap-space-md bg-surface-container-lowest"
            >
              <div
                class="flex items-center gap-2 text-on-surface-variant font-body-sm text-body-sm"
              >
              </div>
              <div
                class="flex items-center gap-space-sm w-full sm:w-auto justify-end"
              >
                <button
                  class="px-4 py-2 rounded-lg bg-surface-container hover:bg-surface-container-high text-on-surface font-label-md text-label-md transition-colors"
                  id="cancelActionBtn"
                >
                  Cancel
                </button>
                <button
                  class="px-6 py-2 rounded-lg bg-primary-container hover:opacity-95 text-on-primary font-label-lg text-label-lg shadow-sm transition-all active:scale-95 flex items-center gap-1.5"
                  id="bottomSaveBtn"
                >
                  <span class="material-symbols-outlined text-base">check</span>
                  <span>Save Note</span>
                </button>
              </div>
            </div>
          </div>
        </div>
      </div>
    </main>
    <script type="module" src="../logic/note-editor.js"></script>
  </body>
</html>
