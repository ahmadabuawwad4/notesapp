<!doctype html>
<html lang="en">
<head>
  <script>
      if(!sessionStorage.getItem("token")){
        location.href = "./login.html"
      }
    </script>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Notes - Note Editor</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Plus+Jakarta+Sans:wght@600;700&family=Material+Symbols+Outlined:wght@100..700&display=swap"
    rel="stylesheet"
  >

  <link rel="stylesheet" href="../styles/note-editor.css">
</head>

<body>
  <!-- =========================
       App Header Component
       ========================= -->
  <header class="app-header">
    <div class="app-header__inner">
      <div class="app-header__brand">
        <div class="app-header__divider" aria-hidden="true"></div>

        <img
          class="app-header__logo"
          src="../assets/NotesAppLogo.png"
          alt="Notes logo"
        >

        <span class="app-header__name">Notes</span>
      </div>
    </div>
  </header>

  <!-- =========================
       Note Editor Page
       ========================= -->
  <main class="note-editor-page">
    <div class="note-editor-page__content">

      <!-- =========================
           Editor Toolbar Component
           ========================= -->
      <section class="editor-toolbar" aria-label="Note actions">
        <div class="editor-toolbar__inner">

          <div class="editor-toolbar__context">
            <a
              class="toolbar-link"
              href="./dashboard.html"
              id="backToNotesBtn"
            >
              <span class="material-symbols-outlined" aria-hidden="true">arrow_back</span>
              <span class="toolbar-link__text">Back to Notes</span>
            </a>

            <div class="toolbar-status" id="noteStatus" aria-live="polite">
              <span class="material-symbols-outlined" aria-hidden="true">edit_note</span>
              <span id="message">Editing Note</span>
            </div>
          </div>

          <div class="editor-toolbar__actions">
            <button
              class="toolbar-button toolbar-button--danger"
              id="discardBtn"
              type="button"
            >
              <span class="material-symbols-outlined" aria-hidden="true">delete</span>
              <span class="toolbar-button__text">Delete</span>
            </button>

            <button
              class="toolbar-button toolbar-button--primary"
              id="topSaveBtn"
              type="button"
            >
              <span class="material-symbols-outlined" aria-hidden="true">save</span>
              <span class="toolbar-button__text">Save Note</span>
            </button>
          </div>

        </div>
      </section>

      <!-- =========================
           Note Editor Component
           ========================= -->
      <section class="editor-workspace" aria-label="Note editor">
        <form class="note-editor" id="noteEditorForm">

          <input
            class="note-editor__title"
            id="noteTitle"
            name="title"
            type="text"
            placeholder="Untitled note..."
            autocomplete="off"
            aria-label="Note title"
          >

          <div class="note-editor__content-wrapper">
            <textarea
              class="note-editor__content"
              id="editorContent"
              name="content"
              rows="16"
              placeholder="Start typing your ideas, notes, and task plans here..."
              aria-label="Note content"
            ></textarea>
          </div>

          <!-- =========================
               Editor Footer Component
               ========================= -->
          <footer class="note-editor__footer">
            <div aria-hidden="true"></div>

            <div class="note-editor__footer-actions">
              <button
                class="editor-action editor-action--secondary"
                id="cancelActionBtn"
                type="button"
              >
                Cancel
              </button>

              <button
                class="editor-action editor-action--primary"
                id="bottomSaveBtn"
                type="submit"
              >
                <span class="material-symbols-outlined" aria-hidden="true">check</span>
                <span>Save Note</span>
              </button>
            </div>
          </footer>

        </form>
      </section>

    </div>
  </main>

  <script type="module" src="../logic/note-editor.js"></script>
</body>
</html>
